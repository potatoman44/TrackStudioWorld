[package]
name = "mkwtrack"
description = "Mario Kart World course data: BYML, Banc course files, the game catalog, BFRES models, BNTX textures and editing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["mario-kart", "byml", "modding", "nintendo-switch"]
categories = ["game-development", "parser-implementations"]
publish = false

[dependencies]
base64 = "0.22"
crc32fast = "1.5.4"
fastrand = "2.5.0"
flate2 = "1.1.10"
glam = "0.34.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
nalgebra = "0.35.0"
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
texture2ddecoder = "0.1.2"
zstd = "0.14.3"
